name: SonarQube Cloud

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Quality / SonarQube
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Generate backend coverage
        working-directory: apps/api
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Prepare Java dependency classpath for SonarQube
        working-directory: apps/api
        run: ./mvnw --batch-mode --no-transfer-progress dependency:copy-dependencies -DincludeScope=test -DoutputDirectory=target/dependency

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Generate frontend coverage
        working-directory: apps/web
        run: npm test

      - name: Verify coverage inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/api/target/site/jacoco/jacoco.xml
          test -s apps/web/coverage/lcov.info

      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
