name: Bootstrap Frontend Lockfile

on:
  push:
    branches:
      - portoduquedev/por-6-01-monorepo-and-developer-bootstrap

permissions:
  contents: write

concurrency:
  group: bootstrap-frontend-lockfile
  cancel-in-progress: true

jobs:
  lockfile:
    name: Bootstrap / package-lock
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: portoduquedev/por-6-01-monorepo-and-developer-bootstrap

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Generate lockfile without dependency lifecycle scripts
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/web/package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit -m "build(web): generate npm lockfile"
          git push origin HEAD:portoduquedev/por-6-01-monorepo-and-developer-bootstrap
