spring.application.name=saas-skeleton-api
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.flyway.enabled=true
spring.flyway.validate-migration-naming=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway owns the Spring Session schema too.
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=SAAS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax

# Public API contract and operational endpoints
springdoc.paths-to-match=/api/v1/**
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Machine-readable console logs; MDC values such as requestId are included automatically.
logging.structured.format.console=logstash
